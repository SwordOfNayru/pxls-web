<!DOCTYPE html>
<html lang="en">
<head>
    <title>Pxls Login</title>
</head>
<body>
    <p>Authenticating...</p>
    <p>If you see this for more than a few seconds, it may have worked and your browser didn't close this window.</p>
    <p>If it didn't work, please contact a developer on our Discord (linked under the info panel).</p>
    <script type="text/javascript">
        const search = location.search.substring(1);
        // https://stackoverflow.com/a/8649003/6901668
        const queryParams = JSON.parse('{"' + decodeURI(search).replace(/"/g, '\\"').replace(/&/g, '","').replace(/=/g,'":"') + '"}');

        if (queryParams['nologin'] != null) {
            if (localStorage.getItem('auth_same_window') != null) {
                localStorage.removeItem('auth_same_window');
                window.location = '/';
            } else {
                window.close();
            }
        } else {
            const respond = {
                signup: queryParams["signup"] === "true",
                token: queryParams["token"]
            };
            if (localStorage.getItem('auth_same_window') != null) {
                localStorage.setItem('auth_respond', JSON.stringify(respond));
                localStorage.removeItem('auth_same_window');
                localStorage.setItem('auth_proceed', 'true');
                window.location = '/';
            } else if (window.opener) {
                // Hand the token straight to the tab that started the sign in.
                // Going through localStorage would notify every open tab, and the
                // first one to answer consumes the token, so the tab the user is
                // actually looking at ends up with nothing.
                window.opener.postMessage({ type: 'pxls-auth-respond', ...respond }, location.origin);
                window.close();
            } else {
                // No opener to talk to (popup opened standalone): fall back to the
                // storage relay.
                localStorage.setItem('auth_respond', JSON.stringify(respond));
                localStorage.setItem('auth', (new Date()).toString());
                window.close();
            }
        }
    </script>
</body>
</html>
